services:
  thanksgiving:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?Set ADMIN_ORIGIN in .env}
      COOKIE_SECURE: "true"
      PORT: "3000"
      DATABASE_PATH: /data/thanksgiving.sqlite
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - thanksgiving-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/form').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  thanksgiving-data:
