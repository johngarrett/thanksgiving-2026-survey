<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign up for Thanksgiving food and tasks."><title>Thanksgiving</title></head>
<body>
  <main>
    <h1 id="title">Thanksgiving</h1>
    <form id="signup">
      <div id="sections"></div>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <button id="submit" type="submit" disabled>Submit</button>
    </form>
    <dialog id="name-dialog" aria-labelledby="dialog-title">
      <form id="save-form">
        <button id="cancel" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></button>
        <h2 id="dialog-title" class="sr-only">Your name</h2>
        <label class="name-field"><input id="guest-name" name="name" required maxlength="100" autocomplete="name"><span>Your name</span></label>
        <p id="save-status" role="status" aria-live="polite"></p>
        <button id="save" type="submit">Submit</button>
      </form>
    </dialog>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
