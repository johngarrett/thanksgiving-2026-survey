<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanksgiving intake form</title>
  <meta name="description" content="Sign up for Thanksgiving food and tasks.">
  <link rel="canonical" href="https://garrepi.dev/thanksgiving-2026-survey/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thanksgiving intake form">
  <meta property="og:description" content="Sign up for Thanksgiving food and tasks.">
  <meta property="og:url" content="https://garrepi.dev/thanksgiving-2026-survey/">
  <meta property="og:image" content="https://garrepi.dev/thanksgiving-2026-survey/images/bliding-stew.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1440">
  <meta property="og:image:height" content="1710">
  <meta property="og:image:alt" content="A humorous poster with handwritten suggestions for one-day blinding stew.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Thanksgiving intake form">
  <meta name="twitter:description" content="Sign up for Thanksgiving food and tasks.">
  <meta name="twitter:image" content="https://garrepi.dev/thanksgiving-2026-survey/images/bliding-stew.jpg">
  <meta name="twitter:image:alt" content="A humorous poster with handwritten suggestions for one-day blinding stew.">
</head>
<body>
  <main>
    <h1 id="title">Thanksgiving</h1>
    <img class="intro-image" src="%BASE_URL%images/bliding-stew.jpg" width="1440" height="1710" alt="A humorous poster with handwritten suggestions for one-day blinding stew.">
    <form id="signup">
      <div id="sections"></div>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <button id="submit" type="submit" disabled>Submit</button>
    </form>
    <dialog id="name-dialog" aria-labelledby="dialog-title">
      <form id="save-form">
        <button id="cancel" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></button>
        <h2 id="dialog-title" class="sr-only">Your name</h2>
        <label class="name-field"><input id="guest-name" name="name" required maxlength="100" autocomplete="name"><span>Your name</span></label>
        <p id="save-status" role="status" aria-live="polite"></p>
        <button id="save" type="submit">Submit</button>
      </form>
    </dialog>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
